name: Generate SEO Pages

on:
  # Allows you to click a button in GitHub to run it manually
  workflow_dispatch:
  
  # Listens for the automatic webhook ping from Supabase
  repository_dispatch:
    types: [supabase-update]
    
  # Runs automatically if you manually push code to the main branch
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Grants the bot permission to push the new HTML files back to your repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Supabase Client
        run: npm install @supabase/supabase-js
        
      - name: Run Build Script
        run: node build.js
        
      - name: Commit and Push Generated HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto-generated SEO pages from Supabase"
          git push
