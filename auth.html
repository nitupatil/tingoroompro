<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TingoRooms | Account</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script src="config.js"></script>

    <style>
        :root {
            --primary: #dc2626;
            --primary-hover: #b91c1c;
            --bg: #000000;
            --surface: #121212;
            --surface-light: #262626;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
            --border: #333333;
            --nav-height: 65px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding-bottom: calc(var(--nav-height) + 20px);
            display: flex; justify-content: center; min-height: 100vh;
        }

        .container {
            width: 100%; max-width: 450px;
            padding: 30px 20px;
        }

        .logo { text-align: center; font-size: 2rem; font-weight: 800; margin-bottom: 25px; letter-spacing: -1px; }
        .logo span { color: var(--primary); }

        .view-section { display: none; animation: fadeIn 0.3s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 700; }
        p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
        .input-group input, .input-group select {
            width: 100%; padding: 12px 14px; border: 1px solid var(--border);
            border-radius: 6px; font-size: 0.95rem; outline: none;
            background-color: var(--surface); color: white; transition: border-color 0.2s;
        }
        .input-group input:focus { border-color: var(--primary); }
        .input-group input:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-full {
            width: 100%; padding: 14px; background: var(--primary); color: white;
            border: none; border-radius: 6px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: background 0.2s; margin-top: 10px;
        }
        .btn-full:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border); margin-top: 15px; }
        .btn-outline:hover { background: var(--surface-light); }

        .links { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); }
        .links a { color: white; text-decoration: none; font-weight: 600; cursor: pointer; }

        /* Profile Specific UI */
        .profile-header { text-align: center; margin-bottom: 30px; }
        .avatar-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); margin-bottom: 15px; background: var(--surface-light); }
        .section-divider { height: 1px; background: var(--border); margin: 30px 0; }

        /* Bottom App Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height);
            background-color: var(--surface); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item { color: var(--text-muted); text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; font-weight: 500; width: 25%; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 1.4rem; margin-bottom: 4px; }
        .add-post-btn { background-color: var(--primary); color: white !important; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; transform: translateY(-10px); box-shadow: 0 4px 10px rgba(220, 38, 38, 0.4); }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Tingo<span>Rooms.</span></div>

        <!-- PROFILE VIEW (Authenticated) -->
        <div id="view-profile" class="view-section">
            <div class="profile-header">
                <img id="profAvatar" src="" class="avatar-img">
                <h2 id="profNameDisplay">Loading...</h2>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="profEmail" disabled>
            </div>
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="profName">
            </div>
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="text" id="profMobile">
            </div>
            <button class="btn-full" id="updateBtn" onclick="updateProfile()">Update Information</button>

            <div class="section-divider"></div>

            <h2>Security</h2>
            <div class="input-group"><input type="password" id="oldPass" placeholder="Current Password"></div>
            <div class="input-group"><input type="password" id="newPass" placeholder="New Password"></div>
            <button class="btn-full" style="background: var(--surface-light);" onclick="changePassword()">Change Password</button>

            <button class="btn-full btn-outline" style="color: var(--primary); border-color: var(--primary);" onclick="logout()">Log Out</button>
        </div>

        <!-- LOGIN VIEW (Unauthenticated) -->
        <div id="view-login" class="view-section">
            <h2>Welcome back</h2>
            <p class="subtitle">Log in to manage your spaces and messages.</p>
            <div class="input-group"><input type="email" id="loginEmail" placeholder="Email Address"></div>
            <div class="input-group"><input type="password" id="loginPass" placeholder="Password"></div>
            <button class="btn-full" id="loginBtn" onclick="loginUser()">Log In</button>
            <div class="links">Don't have an account? <a onclick="switchView('view-register')">Sign up</a></div>
        </div>

        <!-- Keep your existing Register/OTP/Forgot HTML views here -->
        <!-- (Omitted for brevity, paste them exactly as they were in the previous version) -->

    </div>

    <!-- App Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>Home</a>
        <a href="map.html" class="nav-item"><span class="nav-icon">🗺️</span>Map</a>
        <a href="post.html" class="nav-item add-post-btn">+</a>
        <a href="chat.html" class="nav-item"><span class="nav-icon">💬</span>Chat</a>
        <a href="auth.html" class="nav-item active"><span class="nav-icon">👤</span>Account</a>
    </nav>

    <script>
        const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

        window.onload = checkSession;

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        // --- SESSION & PROFILE FETCHING ---
        async function checkSession() {
            const uid = localStorage.getItem('tingo_user_id');
            const token = localStorage.getItem('tingo_session_token');

            if (!uid || !token) {
                switchView('view-login');
                return;
            }

            try {
                // Securely fetch profile using the gatekeeper RPC
                const { data, error } = await supabaseClient.rpc('get_secure_profile', { uid: uid, d_token: token });
                
                if (error) throw error;

                // Populate UI
                document.getElementById('profNameDisplay').innerText = data.name;
                document.getElementById('profName').value = data.name;
                document.getElementById('profEmail').value = data.email;
                document.getElementById('profMobile').value = data.mobile_no;
                document.getElementById('profAvatar').src = data.image_url || 'https://via.placeholder.com/100?text=User';
                
                switchView('view-profile');
            } catch (err) {
                console.error(err);
                logout(); // Token invalid, force logout
            }
        }

        // --- SECURE LOGIN ---
        async function loginUser() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            if(!email || !pass) return;

            const deviceToken = 'dev_' + Math.random().toString(36).substr(2, 9);

            try {
                // Secure login via RPC (handles password check & token update on backend)
                const { data, error } = await supabaseClient.rpc('secure_login', { 
                    user_email: email, user_pass: pass, device_token: deviceToken 
                });

                if (error) throw error;

                localStorage.setItem('tingo_session_token', deviceToken);
                localStorage.setItem('tingo_user_id', data.id);
                localStorage.setItem('tingo_user_name', data.name);
                
                checkSession(); // Load profile view
            } catch (err) { alert(err.message); }
        }

        // --- UPDATE PROFILE ---
        async function updateProfile() {
            const name = document.getElementById('profName').value;
            const mobile = document.getElementById('profMobile').value;
            
            try {
                const { data, error } = await supabaseClient.rpc('secure_update_profile', {
                    uid: localStorage.getItem('tingo_user_id'),
                    d_token: localStorage.getItem('tingo_session_token'),
                    new_name: name, new_mobile: mobile
                });

                if (error || !data) throw new Error("Update failed");
                alert("Profile updated successfully!");
                document.getElementById('profNameDisplay').innerText = name;
            } catch (err) { alert(err.message); }
        }

        // --- CHANGE PASSWORD ---
        async function changePassword() {
            const oldPass = document.getElementById('oldPass').value;
            const newPass = document.getElementById('newPass').value;
            if(!oldPass || !newPass) return alert("Fill both password fields");

            try {
                const { error } = await supabaseClient.rpc('secure_change_password', {
                    uid: localStorage.getItem('tingo_user_id'),
                    d_token: localStorage.getItem('tingo_session_token'),
                    old_pass: oldPass, new_pass: newPass
                });

                if (error) throw error;
                alert("Password updated securely!");
                document.getElementById('oldPass').value = '';
                document.getElementById('newPass').value = '';
            } catch (err) { alert(err.message); }
        }

        function logout() {
            localStorage.clear();
            switchView('view-login');
        }
    </script>
</body>
</html>
