<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TingoRooms | Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Absolute paths to ensure it loads from anywhere -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>

    <style>
        :root {
            --primary: #dc2626; --primary-hover: #b91c1c;
            --bg: #000000; --surface: #121212; --surface-light: #262626;
            --text-main: #ffffff; --text-muted: #a3a3a3; --border: #333333;
            --nav-height: 65px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding-bottom: calc(var(--nav-height) + 20px); }

        header {
            position: sticky; top: 0; background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
            padding: 15px 20px; z-index: 100; border-bottom: 1px solid var(--surface-light); text-align: center;
        }
        .logo { font-size: 1.5rem; font-weight: 800; text-decoration: none; color: white; }
        .logo span { color: var(--primary); }

        .container { max-width: 500px; margin: 40px auto; padding: 20px; }
        h1 { font-size: 1.8rem; margin-bottom: 10px; font-weight: 700; text-align: center; }
        p.subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 0.95rem; }

        .form-group { margin-bottom: 20px; }
        .form-group input {
            width: 100%; padding: 16px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 1rem; background-color: var(--surface); color: white; outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: var(--primary); }

        .btn-submit {
            width: 100%; padding: 16px; background: var(--primary); color: white; border: none;
            border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--primary-hover); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

        .btn-logout {
            width: 100%; padding: 16px; background: transparent; color: var(--primary); border: 1px solid var(--primary);
            border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 20px;
        }
        .btn-logout:hover { background: rgba(220, 38, 38, 0.1); }

        /* Bottom App Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height);
            background-color: var(--surface); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item { color: var(--text-muted); text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; font-weight: 500; width: 25%; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 1.4rem; margin-bottom: 4px; }
        .add-post-btn { background-color: var(--primary); color: white !important; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; transform: translateY(-10px); box-shadow: 0 4px 10px rgba(220, 38, 38, 0.4); }
        
        .profile-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 25px; text-align: center; }
        .avatar { width: 80px; height: 80px; background: var(--primary); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; margin: 0 auto 15px; }

        /* ZERO-FLICKER LOGIC: Hide both initially, let JS show one immediately */
        #loginView, #profileView, #otpView { display: none; }
    </style>

    <!-- ZERO DELAY STATE CHECK -->
    <script>
        const storedToken = localStorage.getItem('tingo_session_token');
        if (storedToken) {
            document.write('<style>#profileView { display: block !important; }</style>');
        } else {
            document.write('<style>#loginView { display: block !important; }</style>');
        }
    </script>
</head>
<body>

    <header>
        <a href="/" class="logo">Tingo<span>Rooms.</span></a>
    </header>

    <!-- VIEW 1: EMAIL LOGIN -->
    <div class="container" id="loginView">
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to post rooms and chat with owners.</p>
        
        <div class="form-group">
            <input type="email" id="emailInput" placeholder="Enter your email address" autocomplete="email">
        </div>
        <button class="btn-submit" id="sendOtpBtn" onclick="sendOTP()">Send Verification Code</button>
    </div>

    <!-- VIEW 2: ENTER OTP -->
    <div class="container" id="otpView">
        <h1>Verify Email</h1>
        <p class="subtitle">Enter the 6-digit code sent to your email.</p>
        
        <div class="form-group">
            <input type="number" id="otpInput" placeholder="123456" autocomplete="one-time-code">
        </div>
        <button class="btn-submit" id="verifyOtpBtn" onclick="verifyOTP()">Verify & Login</button>
        <button class="btn-logout" onclick="location.reload()" style="border:none; margin-top:10px;">Cancel</button>
    </div>

    <!-- VIEW 3: PROFILE (Logged In) -->
    <div class="container" id="profileView">
        <div class="profile-card">
            <div class="avatar" id="userAvatar">?</div>
            <h2 id="userNameDisplay" style="margin-bottom: 5px;">User</h2>
            <p id="userEmailDisplay" style="color: var(--text-muted); margin-bottom: 25px;"></p>
            
            <button class="btn-submit" onclick="window.location.href='/post'" style="margin-bottom: 10px;">Manage Listings</button>
            <button class="btn-logout" onclick="logout()">Sign Out</button>
        </div>
    </div>

    <!-- App Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="/" class="nav-item"><span class="nav-icon">🏠</span>Home</a>
        <a href="/map" class="nav-item"><span class="nav-icon">🗺️</span>Map</a>
        <a href="/post" class="nav-item add-post-btn">+</a>
        <a href="/chat" class="nav-item"><span class="nav-icon">💬</span>Chat</a>
        <a href="/auth" class="nav-item active"><span class="nav-icon">👤</span>Account</a>
    </nav>

    <script>
        if (typeof CONFIG === 'undefined') alert("Config missing. Check your script paths.");
        const supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        
        let userEmail = '';

        // Populate Profile if already logged in
        if (storedToken) {
            const email = localStorage.getItem('tingo_user_email') || 'User';
            document.getElementById('userEmailDisplay').innerText = email;
            document.getElementById('userNameDisplay').innerText = email.split('@')[0];
            document.getElementById('userAvatar').innerText = email.charAt(0).toUpperCase();
        }

        // 1. Send OTP to Email
        async function sendOTP() {
            const emailInput = document.getElementById('emailInput').value.trim();
            if (!emailInput) return alert("Please enter a valid email.");
            
            const btn = document.getElementById('sendOtpBtn');
            btn.disabled = true; btn.innerText = "Sending...";

            const { error } = await supabase.auth.signInWithOtp({ email: emailInput });

            if (error) {
                alert(error.message);
                btn.disabled = false; btn.innerText = "Send Verification Code";
            } else {
                userEmail = emailInput;
                document.getElementById('loginView').style.display = 'none';
                document.getElementById('otpView').style.display = 'block';
            }
        }

        // 2. Verify OTP & Handle Frictionless Redirect
        async function verifyOTP() {
            const otp = document.getElementById('otpInput').value.trim();
            if (!otp) return alert("Please enter the code.");

            const btn = document.getElementById('verifyOtpBtn');
            btn.disabled = true; btn.innerText = "Verifying...";

            const { data, error } = await supabase.auth.verifyOtp({ email: userEmail, token: otp, type: 'email' });

            if (error) {
                alert(error.message);
                btn.disabled = false; btn.innerText = "Verify & Login";
            } else {
                // Login Success! Save session
                localStorage.setItem('tingo_session_token', data.session.access_token);
                localStorage.setItem('tingo_user_id', data.user.id);
                localStorage.setItem('tingo_user_email', data.user.email);
                localStorage.setItem('tingo_user_name', data.user.email.split('@')[0]);

                // The Frictionless Magic: Check if they were doing something before login
                const redirectTarget = localStorage.getItem('redirect_after_login');
                if (redirectTarget) {
                    localStorage.removeItem('redirect_after_login'); // Clear it
                    window.location.href = redirectTarget; // Send them right back to their draft or chat!
                } else {
                    window.location.reload(); // Just show profile
                }
            }
        }

        // 3. Logout Function
        async function logout() {
            await supabase.auth.signOut();
            localStorage.removeItem('tingo_session_token');
            localStorage.removeItem('tingo_user_id');
            localStorage.removeItem('tingo_user_email');
            localStorage.removeItem('tingo_user_name');
            window.location.reload();
        }
    </script>
</body>
</html>
